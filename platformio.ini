; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Deux programmes dans ce projet, un environnement chacun :
;   test_capteurs : lecture distance + couleur + gyro, moteurs coupes
;   evitement     : evitement d'obstacles autonome (le rover roule !)
; Choisir l'environnement dans la barre d'etat de VS Code
; ("Default (Experimental_bot)" -> env:...), ou changer default_envs.

[platformio]
default_envs = test_capteurs

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	pololu/VL53L1X@^1.3.1
	pololu/VL53L0X@^1.3.1
	FastIMU=https://github.com/LiquidCGS/FastIMU/archive/refs/tags/1.3.0.zip

[env:test_capteurs]
build_src_filter = +<test_capteurs.cpp>
monitor_speed = 921600

[env:evitement]
build_src_filter = +<main.cpp>
monitor_speed = 115200

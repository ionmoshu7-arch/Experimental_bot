; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Programmes du projet, un environnement chacun :
;   test_capteurs     : capteurs + pilotage des moteurs, par USB ou WiFi
;   test_capteurs_ota : le meme, televerse par WiFi depuis le PC (rover.local)
;   test_capteurs_via_camera : le meme, televerse A TRAVERS LA CAMERA
;                       (seul le cable de la camera est branche au PC)
;   evitement         : evitement d'obstacles autonome (le rover roule !)
;   camera            : carte ESP32-S3 N16R8 CAM (video, photos), autre carte
;   camera_ota        : la meme, televersee par WiFi depuis le PC (camera.local)
; Les televersements "par WiFi" sont faits par le PC en HTTP (scripts/maj_wifi.py) :
; le Pare-feu Windows ne les bloque pas, contrairement a l'OTA classique.
; Choisir l'environnement dans la barre d'etat de VS Code
; ("Default (Experimental_bot)" -> env:...), ou changer default_envs.
;
; Identifiants (non versionnes) : include/secrets.h et secrets.ini

[platformio]
default_envs = test_capteurs
extra_configs = secrets.ini

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; televerse toujours dans la bonne carte (rover / camera) : voir le script
extra_scripts = pre:scripts/port_carte.py
; carte du rover : puce USB CH343, numero de serie 5C38182766
custom_usb_serie = 5C38182766
lib_deps =
	pololu/VL53L1X@^1.3.1
	pololu/VL53L0X@^1.3.1
	FastIMU=https://github.com/LiquidCGS/FastIMU/archive/refs/tags/1.3.0.zip

[env:test_capteurs]
build_src_filter = +<test_capteurs/>
monitor_speed = 921600
; la page de controle est servie par le rover lui-meme
board_build.embed_txtfiles = web/rover_moniteur.html
lib_deps =
	${env.lib_deps}
	links2004/WebSockets@^2.7.3
	remotexy/RemoteXY@^4.1.11

; Televersement par WiFi. Mot de passe dans secrets.ini :
;   [env:test_capteurs_ota]
;   upload_flags = --auth=...
[env:test_capteurs_ota]
extends = env:test_capteurs
upload_protocol = custom
upload_port = rover.local
upload_command = $PYTHONEXE "$PROJECT_DIR/scripts/maj_wifi.py" $UPLOAD_PORT "$SOURCE" $UPLOAD_FLAGS

; Programme du rover envoye par le cable de la camera, puis par le WiFi
; (scripts/maj_rover_par_camera.py). Fermer le moniteur serie de la camera.
[env:test_capteurs_via_camera]
extends = env:test_capteurs
upload_protocol = custom
upload_command = $PYTHONEXE "$PROJECT_DIR/scripts/maj_rover_par_camera.py" "$SOURCE"

[env:evitement]
build_src_filter = +<evitement/>
monitor_speed = 115200

; ---------- carte camera : Diymore ESP32-S3-WROOM CAM, N16R8, OV2640 ----------
[env:camera]
build_src_filter = +<camera/>
; console des 2 cartes (voir src/camera/Pont.h)
monitor_speed = 460800
; carte camera : puce USB CH340 (sans numero de serie)
custom_usb_serie =
custom_usb_vidpid = 1A86:7523
; la puce CH340 n'est pas fiable a 921600 bauds
upload_speed = 460800
; 16 Mo de flash QIO, 8 Mo de PSRAM octale
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM
lib_deps =
	links2004/WebSockets@^2.7.3

; Televersement par WiFi. Mot de passe dans secrets.ini :
;   [env:camera_ota]
;   upload_flags = --auth=...
[env:camera_ota]
extends = env:camera
upload_protocol = custom
upload_port = camera.local
upload_command = $PYTHONEXE "$PROJECT_DIR/scripts/maj_wifi.py" $UPLOAD_PORT "$SOURCE" $UPLOAD_FLAGS
